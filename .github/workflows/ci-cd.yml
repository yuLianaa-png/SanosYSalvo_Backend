name: CI/CD AWS

on:
  push:
    branches:
      - ci-cd
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 496097048853
  ECR_REGISTRY: 496097048853.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build auth-service
        run: mvn -f auth-service/pom.xml clean package -DskipTests

      - name: Build pet-service
        run: mvn -f pet-service/pom.xml clean package -DskipTests

      - name: Build match-service
        run: mvn -f match-service/pom.xml clean package -DskipTests

      - name: Build notification-service
        run: mvn -f notification-service/pom.xml clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
          docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push Docker images
        run: |
          build_and_push() {
            SERVICE_PATH=$1
            ECR_REPO=$2

            echo "Building $ECR_REPO from $SERVICE_PATH"

            docker build \
              -t "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG" \
              -t "$ECR_REGISTRY/$ECR_REPO:latest" \
              "$SERVICE_PATH"

            docker push "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
            docker push "$ECR_REGISTRY/$ECR_REPO:latest"
          }

          build_and_push ./auth-service sanos-salvos-auth
          build_and_push ./pet-service sanos-salvos-petserv
          build_and_push ./match-service sanos-salvos-match
          build_and_push ./notification-service sanos-salvos-notif
          build_and_push ./nginx sanos-salvos-nginx

  deploy:
    name: Deploy to Docker Swarm
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          sed -i 's/\r$//' ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          
          cat > ~/.ssh/config << EOF
          Host bastion
            HostName ${{ secrets.BASTION_IP }}
            User ${{ secrets.BASTION_USER }}
            IdentityFile ~/.ssh/ec2_key.pem
            StrictHostKeyChecking no
          
          Host manager
            HostName ${{ secrets.MANAGER_PRIVATE_IP }}
            User ${{ secrets.MANAGER_USER }}
            IdentityFile ~/.ssh/ec2_key.pem
            ProxyJump bastion
            StrictHostKeyChecking no
          EOF
      - name: Test SSH connectivity to bastion
        run: |
          echo "Testing TCP connection to bastion port 22..."
          timeout 15 bash -c "</dev/tcp/${{ secrets.BASTION_IP }}/22" && echo "Port 22 reachable" || echo "Port 22 NOT reachable"

          echo "Testing SSH connection to bastion..."
          ssh -vvv bastion "echo 'SSH to bastion OK'"    


      - name: Deploy services in EC2 manager
        run: |
          ssh manager << 'EOF'
            set -e
          
            export AWS_REGION="us-east-1"
            export AWS_ACCOUNT_ID="496097048853"
            export ECR_REGISTRY="496097048853.dkr.ecr.us-east-1.amazonaws.com"
            export IMAGE_TAG="${{ github.sha }}"
          
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            export AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}"
          
            echo "Logging in to ECR..."
            aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"
          
            echo "Updating Docker Swarm services..."
          
            docker service update \
              --with-registry-auth \
              --image "$ECR_REGISTRY/sanos-salvos-auth:$IMAGE_TAG" \
              sanos_auth-service
          
            docker service update \
              --with-registry-auth \
              --image "$ECR_REGISTRY/sanos-salvos-petserv:$IMAGE_TAG" \
              --env-add MATCH_SERVICE_URL=http://match-service:8080 \
              sanos_pet-service
          
            docker service update \
              --with-registry-auth \
              --image "$ECR_REGISTRY/sanos-salvos-match:$IMAGE_TAG" \
              sanos_match-service
          
            docker service update \
              --with-registry-auth \
              --image "$ECR_REGISTRY/sanos-salvos-notif:$IMAGE_TAG" \
              --env-add AUTH_SERVICE_URL=http://auth-service:8080 \
              --env-add INTERNAL_SERVICE_SECRET=una_clave_super_secreta_interna_para_lambda \
              sanos_notification-service
          
            docker service update \
              --with-registry-auth \
              --image "$ECR_REGISTRY/sanos-salvos-nginx:$IMAGE_TAG" \
              sanos_nginx
          
            echo "Current Swarm services:"
            docker service ls
          EOF